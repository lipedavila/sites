<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SOS Português - Centro de Excelência</title>
    
    <!-- React & Tailwind -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700;800&family=DM+Sans:wght@400;500;700&display=swap" rel="stylesheet">

    <style>
        body { font-family: 'DM Sans', sans-serif; }
        h1, h2, h3, h4, .brand-font { font-family: 'Outfit', sans-serif; }
        
        /* --- COMPLEX ANIMATIONS --- */
        @keyframes float-y { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-20px); } }
        @keyframes float-x { 0%, 100% { transform: translateX(0); } 50% { transform: translateX(15px); } }
        @keyframes rotate-slow { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        @keyframes pulse-glow { 0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.4); } 70% { box-shadow: 0 0 0 20px rgba(249, 115, 22, 0); } 100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); } }
        @keyframes blob { 0% { transform: translate(0px, 0px) scale(1); } 33% { transform: translate(30px, -50px) scale(1.1); } 66% { transform: translate(-20px, 20px) scale(0.9); } 100% { transform: translate(0px, 0px) scale(1); } }
        @keyframes slide-up { from { opacity: 0; transform: translateY(40px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pop-in { 0% { opacity: 0; transform: scale(0.8); } 100% { opacity: 1; transform: scale(1); } }
        @keyframes spin-gradient { 0% { background-position: 0% 50%; } 50% { background-position: 100% 50%; } 100% { background-position: 0% 50%; } }
        @keyframes shimmer { 0% { transform: translateX(-100%); } 100% { transform: translateX(100%); } }

        .animate-float-y { animation: float-y 6s ease-in-out infinite; }
        .animate-float-x { animation: float-x 7s ease-in-out infinite; }
        .animate-rotate-slow { animation: rotate-slow 20s linear infinite; }
        .animate-pulse-glow { animation: pulse-glow 2s infinite; }
        .animate-blob { animation: blob 10s infinite; }
        .animate-slide-up { animation: slide-up 0.8s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
        .animate-pop-in { animation: pop-in 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards; }
        .animate-spin-gradient { background-size: 200% 200%; animation: spin-gradient 4s ease infinite; }
        
        .glass-card {
            background: rgba(255, 255, 255, 0.75);
            backdrop-filter: blur(16px);
            border: 1px solid rgba(255, 255, 255, 0.8);
            box-shadow: 0 8px 32px 0 rgba(31, 38, 135, 0.07);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }
        .glass-card:hover {
            background: rgba(255, 255, 255, 0.95);
            transform: translateY(-10px) scale(1.02);
            box-shadow: 0 25px 50px -12px rgba(249, 115, 22, 0.15);
            border-color: rgba(249, 115, 22, 0.3);
        }

        /* Custom Scrollbar for Modals */
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-track { background: transparent; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background-color: rgba(0,0,0,0.1); border-radius: 20px; }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover { background-color: rgba(0,0,0,0.2); }

        /* 3D Depth Utilities */
        .perspective-1000 { perspective: 1000px; }
        .preserve-3d { transform-style: preserve-3d; }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // --- ROBUST ICONS ---
        const Icons = {
            Plus: <path d="M5 12h14M12 5v14" />,
            Book: <><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20" /><path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z" /></>,
            PenTool: <path d="m12 19 7-7 3 3-7 7-3-3zM18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z" />,
            Activity: <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" />,
            Heart: <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5 4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z" />,
            Briefcase: <><rect width="20" height="14" x="2" y="7" rx="2" ry="2" /><path d="M16 21V5a2 2 0 0 0-2-2h-4a2 2 0 0 0-2 2v16" /></>,
            Zap: <polygon points="13 2 3 14 12 14 11 22 21 10 12 10 13 2" />,
            Search: <><circle cx="11" cy="11" r="8" /><path d="m21 21-4.3-4.3" /></>,
            MessageCircle: <path d="m3 21 1.9-5.7a8.5 8.5 0 1 1 3.8 3.8z" />,
            Globe: <><circle cx="12" cy="12" r="10" /><path d="M12 2a15.3 15.3 0 0 1 4 10 15.3 15.3 0 0 1-4 10 15.3 15.3 0 0 1-4-10 15.3 15.3 0 0 1 4-10z" /><path d="M2 12h20" /></>,
            Check: <path d="M20 6 9 17l-5-5" />,
            CheckCircle: <><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></>,
            FileText: <><path d="M14.5 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7.5L14.5 2z" /><polyline points="14 2 14 8 20 8" /></>,
            X: <><path d="M18 6 6 18" /><path d="m6 6 12 12" /></>,
            GraduationCap: <><path d="M22 10v6M2 10l10-5 10 5-10 5z"/><path d="M6 12v5c3 3 9 3 12 0v-5"/></>,
            Target: <><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/></>,
            Users: <><path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></>,
            ArrowRight: <path d="M5 12h14M12 5l7 7-7 7"/>,
            Sun: <><circle cx="12" cy="12" r="5" /><path d="M12 1v2"/><path d="M12 21v2"/><path d="M4.22 4.22l1.42 1.42"/><path d="M18.36 18.36l1.42 1.42"/><path d="M1 12h2"/><path d="M21 12h2"/><path d="M4.22 19.78l1.42-1.42"/><path d="M18.36 5.64l1.42-1.42"/></>,
            Feather: <path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5zM16 8 2 22M17.5 15H9" />,
            Sparkles: <><path d="m12 3-1.912 5.813a2 2 0 0 1-1.275 1.275L3 12l5.813 1.912a2 2 0 0 1 1.275 1.275L12 21l1.912-5.813a2 2 0 0 1 1.275-1.275L12 3Z"/><path d="M5 3v4"/><path d="M9 5H5"/><path d="M19 19v4"/><path d="M15 21h4"/></>,
            BookOpen: <><path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/><path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/></>,
            Construction: <><rect x="2" y="6" width="20" height="8" rx="1"/><path d="M17 14v7"/><path d="M7 14v7"/><path d="M17 3v3"/><path d="M7 3v3"/><path d="M10 14 2.3 6.3"/><path d="m14 6 7.7 7.7"/><path d="m8 6 8 8"/></>
        };

        const Icon = ({ name, size = 24, className = "" }) => (
            <svg xmlns="http://www.w3.org/2000/svg" width={size} height={size} viewBox="0 0 24 24" fill="none" stroke="currentColor" strokeWidth="2.5" strokeLinecap="round" strokeLinejoin="round" className={className}>
                {Icons[name]}
            </svg>
        );

        // --- CONTENT DATA ---
        const CARDS = [
            { id: 'marketplace', title: 'Banco de Talentos', icon: 'Briefcase', category: 'Freelance', desc: 'O ponto de encontro para projetos urgentes. Contrate redatores, revisores e ghostwriters verificados.', accent: 'text-red-500', bg: 'bg-red-50', gradient: 'from-red-500 to-orange-500', details: ['Pagamento Seguro', 'Portfólios Validados', 'Match Rápido'] },
            { id: 'enem', title: 'Foco ENEM', icon: 'FileText', category: 'Educação', desc: 'Laboratório de redação focado na nota 1000. Correção detalhada baseada nas competências oficiais.', accent: 'text-orange-500', bg: 'bg-orange-50', gradient: 'from-orange-500 to-amber-500', details: ['Correção em 24h', 'Repertório Sociocultural', 'Mentoria Individual'] },
            { id: 'ia', title: 'Inteligência Lusa', icon: 'Zap', category: 'Tecnologia', desc: 'Assistente virtual treinado no português brasileiro. Analisa coesão e sugere melhorias.', accent: 'text-blue-500', bg: 'bg-blue-50', gradient: 'from-blue-500 to-indigo-500', details: ['Reescrita Automática', 'Análise de Tom', 'Gramática Contextual'] },
            { id: 'concursos', title: 'Concursos Públicos', icon: 'Target', category: 'Carreira', desc: 'Domine a norma culta exigida pelas bancas. Questões comentadas e simulados de alta complexidade.', accent: 'text-green-500', bg: 'bg-green-50', gradient: 'from-green-500 to-emerald-600', details: ['Bancas: FGV, Cebraspe', 'Videoaulas', 'Mapas Mentais'] },
            { id: 'cursos', title: 'Formação Completa', icon: 'GraduationCap', category: 'Cursos', desc: 'Do básico ao avançado. Atualização gramatical e escrita criativa para profissionais.', accent: 'text-purple-500', bg: 'bg-purple-50', gradient: 'from-purple-500 to-fuchsia-600', details: ['Certificado Digital', 'Acesso Vitalício', 'Material em PDF'] },
            { id: 'traducao', title: 'Conexão Global', icon: 'Globe', category: 'Serviços', desc: 'Tradução técnica e juramentada. A ponte perfeita entre o português e o mundo.', accent: 'text-teal-500', bg: 'bg-teal-50', gradient: 'from-teal-500 to-cyan-600', details: ['Inglês, Espanhol, Francês', 'Revisão Nativa', 'Entrega Expressa'] },
            { id: 'lit', title: 'Clube do Livro', icon: 'Book', category: 'Cultura', desc: 'Expanda seu vocabulário. Análises profundas de obras clássicas para enriquecer sua escrita.', accent: 'text-pink-500', bg: 'bg-pink-50', gradient: 'from-pink-500 to-rose-600', details: ['Resumos Expandidos', 'Debates ao Vivo', 'Curadoria Mensal'] },
            { id: 'comunidade', title: 'Networking', icon: 'Users', category: 'Comunidade', desc: 'Conecte-se com outros profissionais. Troque experiências e encontre parceiros.', accent: 'text-indigo-500', bg: 'bg-indigo-50', gradient: 'from-indigo-500 to-violet-600', details: ['Fórum Moderado', 'Eventos Online', 'Vagas Exclusivas'] }
        ];

        function SOSPlatform() {
            const [activeCard, setActiveCard] = useState(null);
            const [comingSoon, setComingSoon] = useState(false);

            const handleAccess = () => {
                setActiveCard(null);
                setComingSoon(true);
            };

            return (
                <div className="min-h-screen relative overflow-x-hidden bg-[#FFF9F2] text-slate-800 font-sans selection:bg-red-200 selection:text-red-900">
                    
                    {/* --- BACKGROUND ATMOSPHERE (Tropical/Solar/Complex) --- */}
                    <div className="fixed inset-0 pointer-events-none z-0">
                        {/* Organic Blobs with complex animations */}
                        <div className="absolute top-0 left-0 w-[500px] h-[500px] bg-red-200/40 rounded-full mix-blend-multiply filter blur-[80px] animate-blob"></div>
                        <div className="absolute top-0 right-0 w-[500px] h-[500px] bg-orange-200/40 rounded-full mix-blend-multiply filter blur-[80px] animate-blob" style={{animationDelay: '2s'}}></div>
                        <div className="absolute -bottom-32 left-20 w-[600px] h-[600px] bg-pink-200/40 rounded-full mix-blend-multiply filter blur-[80px] animate-blob" style={{animationDelay: '4s'}}></div>
                        
                        {/* Noise Texture for Depth */}
                        <div className="absolute inset-0 bg-[url('https://grainy-gradients.vercel.app/noise.svg')] opacity-20"></div>
                        
                        {/* Floating Elements (Parallax feel) */}
                        <div className="absolute top-[10%] left-[5%] text-red-300 opacity-50 animate-float-y"><Icon name="PenTool" size={48} /></div>
                        <div className="absolute top-[30%] right-[8%] text-orange-300 opacity-50 animate-float-x"><Icon name="Book" size={64} /></div>
                        <div className="absolute bottom-[15%] left-[12%] text-blue-300 opacity-40 animate-rotate-slow"><Icon name="Activity" size={80} /></div>
                    </div>

                    {/* --- MAIN CONTAINER --- */}
                    <div className="relative z-10 max-w-7xl mx-auto px-4 py-8 md:py-16 flex flex-col items-center">
                        
                        {/* HEADER */}
                        <header className="w-full flex justify-between items-center mb-20 animate-slide-up">
                            <div className="flex items-center gap-3">
                                <div className="bg-gradient-to-br from-red-500 to-orange-500 text-white p-3 rounded-2xl shadow-xl shadow-red-200 animate-pulse-glow">
                                    <Icon name="Plus" size={28} />
                                </div>
                                <div className="leading-tight">
                                    <h1 className="text-2xl font-bold text-slate-800 tracking-tight">SOS <span className="text-red-500">Português</span></h1>
                                    <p className="text-[10px] font-bold text-slate-400 uppercase tracking-widest">Resgate Linguístico</p>
                                </div>
                            </div>
                            
                            <a href="https://www.aulatotal.com.br" target="_blank" className="group flex items-center gap-2 bg-white/60 backdrop-blur-md border border-white/50 px-5 py-2.5 rounded-full shadow-sm hover:shadow-lg transition-all cursor-pointer">
                                <span className="relative flex h-2 w-2">
                                  <span className="animate-ping absolute inline-flex h-full w-full rounded-full bg-green-400 opacity-75"></span>
                                  <span className="relative inline-flex rounded-full h-2 w-2 bg-green-500"></span>
                                </span>
                                <span className="text-xs font-bold text-slate-500 group-hover:text-red-500 transition-colors uppercase tracking-wider">
                                    Incubado por AulaTotal
                                </span>
                            </a>
                        </header>

                        {/* HERO SECTION */}
                        <div className="text-center mb-24 relative w-full max-w-4xl animate-slide-up" style={{animationDelay: '0.1s'}}>
                            
                            {/* Central Emblem */}
                            <div className="relative inline-block mb-12 group cursor-pointer perspective-1000">
                                <div className="absolute inset-0 bg-gradient-to-tr from-red-500/20 to-orange-500/20 rounded-full blur-[60px] animate-pulse-glow"></div>
                                <div className="relative z-10 bg-gradient-to-br from-white to-red-50 w-44 h-44 rounded-[3rem] shadow-[0_25px_60px_-12px_rgba(239,68,68,0.4)] flex items-center justify-center border-[6px] border-white transform transition-transform duration-500 group-hover:rotate-6 preserve-3d">
                                    <div className="text-red-500 drop-shadow-md">
                                        <Icon name="Plus" size={88} strokeWidth={4} />
                                    </div>
                                    {/* Orbiting Satellites */}
                                    <div className="absolute -top-6 -right-6 bg-white p-4 rounded-3xl shadow-xl animate-float-y text-blue-500">
                                        <Icon name="Book" size={28} />
                                    </div>
                                    <div className="absolute -bottom-4 -left-6 bg-white p-4 rounded-3xl shadow-xl animate-float-x text-green-500" style={{animationDelay: '0.5s'}}>
                                        <Icon name="PenTool" size={28} />
                                    </div>
                                </div>
                            </div>

                            <h2 className="text-5xl md:text-7xl font-black text-slate-900 mb-8 leading-[1.1] drop-shadow-sm tracking-tight">
                                Eleve seu Português <br/>
                                <span className="text-transparent bg-clip-text bg-gradient-to-r from-red-500 via-orange-500 to-pink-500 animate-spin-gradient">ao Máximo.</span>
                            </h2>
                            <p className="text-xl font-medium text-slate-600 max-w-2xl mx-auto leading-relaxed">
                                A plataforma integrada que une educação de ponta e serviços de excelência.
                                Domine a língua ou contrate quem domina.
                            </p>
                        </div>

                        {/* CARDS GRID */}
                        <div className="w-full grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6 mb-24">
                            {CARDS.map((item, index) => (
                                <div 
                                    key={item.id}
                                    onClick={() => setActiveCard(item)}
                                    className="glass-card rounded-[2rem] p-8 relative group cursor-pointer flex flex-col justify-between min-h-[300px] animate-slide-up"
                                    style={{animationDelay: `${0.2 + (index * 0.1)}s`}}
                                >
                                    <div className={`absolute top-0 left-0 w-full h-1.5 bg-gradient-to-r ${item.gradient} opacity-0 group-hover:opacity-100 transition-opacity duration-300`}></div>
                                    
                                    <div>
                                        <div className="flex justify-between items-start mb-6">
                                            <div className={`w-14 h-14 rounded-2xl ${item.bg} ${item.accent} flex items-center justify-center shadow-inner group-hover:scale-110 transition-transform duration-300`}>
                                                <Icon name={item.icon} size={28} />
                                            </div>
                                            <div className="bg-white/80 border border-slate-100 px-3 py-1.5 rounded-xl shadow-sm backdrop-blur-sm">
                                                <span className="text-[10px] font-bold uppercase tracking-wide text-slate-400">{item.category}</span>
                                            </div>
                                        </div>
                                        <h3 className="text-2xl font-bold text-slate-800 mb-3 leading-tight group-hover:text-red-500 transition-colors">
                                            {item.title}
                                        </h3>
                                        <p className="text-sm font-medium text-slate-500 leading-relaxed line-clamp-3">
                                            {item.desc}
                                        </p>
                                    </div>
                                    <div className="flex items-center gap-2 text-xs font-bold text-slate-400 group-hover:text-red-500 transition-colors uppercase tracking-wider mt-6">
                                        <div className="w-8 h-8 rounded-full border border-slate-200 flex items-center justify-center group-hover:bg-red-50 group-hover:border-red-100 transition-all">
                                            <Icon name="ArrowRight" size={14} />
                                        </div>
                                        <span>Detalhes</span>
                                    </div>
                                </div>
                            ))}
                        </div>

                        {/* FOOTER */}
                        <div className="text-center relative animate-slide-up" style={{animationDelay: '0.8s'}}>
                            <div className="inline-flex items-center gap-3 px-8 py-4 rounded-full bg-white/40 backdrop-blur-md border border-white shadow-lg">
                                <div className="flex -space-x-2">
                                    {[1,2,3].map(i => <div key={i} className="w-6 h-6 rounded-full bg-slate-200 border-2 border-white"></div>)}
                                </div>
                                <span className="text-sm font-bold text-slate-600">Comunidade em crescimento</span>
                            </div>
                            <p className="text-xs font-semibold text-slate-400 mt-6 opacity-60 uppercase tracking-widest">Feito com paixão pela língua.</p>
                        </div>

                    </div>

                    {/* --- MODAL DETALHES (Active Card) --- */}
                    {activeCard && (
                        <div className="fixed inset-0 z-50 flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-slate-900/30 backdrop-blur-md transition-opacity duration-300" onClick={() => setActiveCard(null)}></div>
                            
                            <div className="relative w-full max-w-md bg-white rounded-[3rem] shadow-2xl overflow-hidden animate-pop-in transform transition-all max-h-[85vh] flex flex-col">
                                {/* Header Decoration (Shrink-0 to preserve size) */}
                                <div className={`h-40 shrink-0 bg-gradient-to-br ${activeCard.gradient} relative overflow-hidden flex items-center justify-center`}>
                                    <div className="absolute inset-0 opacity-20" style={{backgroundImage: 'radial-gradient(circle, rgba(255,255,255,0.8) 1.5px, transparent 1.5px)', backgroundSize: '16px 16px'}}></div>
                                    
                                    {/* Big Floating Icon */}
                                    <div className="text-white transform scale-150 drop-shadow-xl animate-float-y">
                                        <Icon name={activeCard.icon} size={64} />
                                    </div>

                                    <button 
                                        onClick={() => setActiveCard(null)}
                                        className="absolute top-6 right-6 bg-white/20 hover:bg-white text-white hover:text-red-500 p-3 rounded-full shadow-lg transition-all backdrop-blur-md"
                                    >
                                        <Icon name="X" size={20} />
                                    </button>
                                </div>

                                <div className="p-8 md:p-10 overflow-y-auto custom-scrollbar">
                                    <span className={`inline-block text-[10px] font-extrabold px-3 py-1 rounded-full mb-3 bg-slate-100 text-slate-500 uppercase tracking-wider`}>
                                        {activeCard.category}
                                    </span>
                                    <h3 className="text-3xl font-black text-slate-900 mb-6 leading-tight">{activeCard.title}</h3>

                                    <div className="mb-8">
                                        <p className="text-slate-600 font-medium leading-relaxed text-lg">
                                            {activeCard.desc}
                                        </p>
                                    </div>

                                    <div className="space-y-3 mb-8">
                                        {activeCard.details.map((detail, idx) => (
                                            <div key={idx} className="flex items-center gap-4 p-4 bg-slate-50/80 rounded-2xl border border-slate-100">
                                                <div className="bg-green-100 text-green-600 p-1.5 rounded-full"><Icon name="CheckCircle" size={16} /></div>
                                                <span className="text-sm font-bold text-slate-700">{detail}</span>
                                            </div>
                                        ))}
                                    </div>

                                    <button 
                                        onClick={handleAccess}
                                        className="w-full py-5 bg-slate-900 text-white font-bold rounded-2xl shadow-xl hover:bg-slate-800 hover:scale-[1.02] active:scale-[0.98] transition-all flex items-center justify-center gap-3 group"
                                    >
                                        <span>Acessar Recurso</span>
                                        <div className="bg-white/20 p-1 rounded-full group-hover:translate-x-1 transition-transform">
                                            <Icon name="ArrowRight" size={16} />
                                        </div>
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                    {/* --- MODAL "VOLTE LOGO" (Coming Soon) --- */}
                    {comingSoon && (
                        <div className="fixed inset-0 z-[60] flex items-center justify-center p-4">
                            <div className="absolute inset-0 bg-orange-900/20 backdrop-blur-lg transition-opacity duration-500" onClick={() => setComingSoon(false)}></div>
                            
                            <div className="relative w-full max-w-sm bg-white rounded-[3rem] shadow-[0_50px_100px_-20px_rgba(249,115,22,0.3)] overflow-hidden animate-pop-in max-h-[85vh] flex flex-col">
                                {/* Gradient Background - Absolute (z-0) */}
                                <div className="absolute inset-0 bg-gradient-to-b from-white via-orange-50 to-red-50 z-0"></div>
                                
                                {/* Decorative Blobs */}
                                <div className="absolute -top-20 -right-20 w-64 h-64 bg-orange-300/30 rounded-full blur-3xl animate-blob"></div>
                                <div className="absolute -bottom-20 -left-20 w-64 h-64 bg-red-300/30 rounded-full blur-3xl animate-blob" style={{animationDelay: '2s'}}></div>

                                {/* Content - Relative (z-10) with Scroll */}
                                <div className="relative z-10 p-10 flex flex-col items-center text-center overflow-y-auto custom-scrollbar">
                                    
                                    {/* Icon Container with Complex Shadow */}
                                    <div className="w-24 h-24 bg-gradient-to-br from-orange-400 to-red-500 rounded-3xl flex items-center justify-center text-white mb-8 shadow-2xl shadow-orange-500/40 rotate-3 hover:rotate-6 transition-transform duration-500 shrink-0">
                                        <Icon name="Construction" size={48} />
                                    </div>

                                    <h3 className="text-2xl font-black text-slate-800 mb-2">Em Incubação!</h3>
                                    <div className="h-1 w-16 bg-gradient-to-r from-orange-500 to-red-500 rounded-full mb-6 shrink-0"></div>

                                    <p className="text-slate-600 font-medium leading-relaxed mb-8">
                                        Estamos preparando este recurso com o padrão de qualidade 
                                        <span className="font-bold text-slate-800"> AulaTotal</span>. 
                                        <br/>Volte em breve para novidades!
                                    </p>

                                    <button 
                                        onClick={() => setComingSoon(false)}
                                        className="w-full py-4 rounded-2xl bg-white border-2 border-slate-100 text-slate-700 font-bold shadow-lg hover:border-orange-200 hover:text-orange-600 hover:shadow-xl transition-all shrink-0"
                                    >
                                        Entendi, vou aguardar
                                    </button>
                                </div>
                            </div>
                        </div>
                    )}

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<SOSPlatform />);
    </script>
</body>
